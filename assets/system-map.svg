    <g><rect x="90" y="44" width="280" height="92" rx="18" fill="#17172D" stroke="#8B5CF6"/><text x="230" y="76" fill="#C4B5FD" font-size="15" font-weight="700">INTERFACES</text><text x="230" y="101" fill="#F8FAFC" font-size="17">REST · GraphQL · gRPC</text><text x="230" y="122" fill="#94A3B8" font-size="12">clear boundaries</text></g>
    <g><rect x="90" y="224" width="280" height="92" rx="18" fill="#17172D" stroke="#8B5CF6"/><text x="230" y="256" fill="#C4B5FD" font-size="15" font-weight="700">EVENTS</text><text x="230" y="281" fill="#F8FAFC" font-size="17">Kafka · RabbitMQ</text><text x="230" y="302" fill="#94A3B8" font-size="12">decoupled throughput</text></g>
    <g><rect x="830" y="44" width="280" height="92" rx="18" fill="#10202C" stroke="#06B6D4"/><text x="970" y="76" fill="#67E8F9" font-size="15" font-weight="700">DATA</text><text x="970" y="101" fill="#F8FAFC" font-size="17">PostgreSQL · Oracle · Redis</text><text x="970" y="122" fill="#94A3B8" font-size="12">plans · indexes · consistency</text></g>
    <g><rect x="830" y="224" width="280" height="92" rx="18" fill="#10251E" stroke="#22C55E"/><text x="970" y="256" fill="#86EFAC" font-size="15" font-weight="700">DELIVERY</text><text x="970" y="281" fill="#F8FAFC" font-size="17">AWS · Docker · Kubernetes</text><text x="970" y="302" fill="#94A3B8" font-size="12">CI/CD · safe releases</text></g>
    <text x="600" y="38" fill="#A78BFA" font-size="14" font-weight="700">DESIGN</text><text x="600" y="337" fill="#22C55E" font-size="14" font-weight="700">OBSERVE · LEARN · IMPROVE</text>
