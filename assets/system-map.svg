<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Engineering system map</title><desc id="desc">A visual map of the layers Abhishek designs, optimizes, and operates.</desc>
  <defs><linearGradient id="edge" x1="0" x2="1"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22C55E"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="360" rx="22" fill="#0B1020"/>
  <g stroke="#334155" stroke-width="2" fill="none"><path d="M260 90L470 180M260 270L470 180M730 180L940 90M730 180L940 270"/><path d="M600 104V54M600 256v50"/></g>
