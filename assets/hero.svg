  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B18"/><stop offset=".55" stop-color="#111A38"/><stop offset="1" stop-color="#071B24"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#A78BFA"/><stop offset=".52" stop-color="#22D3EE"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity=".08"/></pattern>
