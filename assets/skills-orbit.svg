<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Animated skills constellation</title><desc id="desc">Backend engineering at the center, connected to languages, data, cloud, messaging, testing, and frontend skills.</desc>
<defs><radialGradient id="bg"><stop stop-color="#172044"/><stop offset="1" stop-color="#080B18"/></radialGradient><linearGradient id="neon"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22C55E"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.ring1{stroke-dasharray:11 14;animation:dash 7s linear infinite}.ring2{stroke-dasharray:7 18;animation:dashback 10s linear infinite}.core{animation:pulse 2.6s ease-in-out infinite}.pill{animation:float 3.6s ease-in-out infinite}.d2{animation-delay:.6s}.d3{animation-delay:1.2s}.d4{animation-delay:1.8s}.d5{animation-delay:2.4s}.d6{animation-delay:3s}@keyframes dash{to{stroke-dashoffset:-100}}@keyframes dashback{to{stroke-dashoffset:100}}@keyframes pulse{50%{opacity:.78}}@keyframes float{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1200" height="500" rx="24" fill="url(#bg)"/><g fill="none" transform="translate(600 250)"><ellipse class="ring1" rx="315" ry="150" stroke="#22D3EE" opacity=".45" stroke-width="2"/><ellipse class="ring2" rx="450" ry="205" stroke="#8B5CF6" opacity=".35" stroke-width="2"/></g>
<g fill="#22D3EE" filter="url(#glow)"><circle r="5"><animateMotion dur="6s" repeatCount="indefinite" path="M915 250a315 150 0 1 1-630 0a315 150 0 1 1 630 0"/></circle><circle r="5" fill="#A78BFA"><animateMotion dur="9s" repeatCount="indefinite" path="M1050 250a450 205 0 1 0-900 0a450 205 0 1 0 900 0"/></circle><circle r="4" fill="#22C55E"><animateMotion dur="7s" begin="-3s" repeatCount="indefinite" path="M915 250a315 150 0 1 1-630 0a315 150 0 1 1 630 0"/></circle></g>
<g class="core" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#glow)"><circle cx="600" cy="250" r="104" fill="#111A38" stroke="url(#neon)" stroke-width="4"/><text x="600" y="232" fill="#22D3EE" font-size="14" font-weight="700" letter-spacing="3">ENGINEERING CORE</text><text x="600" y="265" fill="#F8FAFC" font-size="25" font-weight="800">BACKEND SYSTEMS</text><text x="600" y="292" fill="#94A3B8" font-size="14">reliable / scalable / observable</text></g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
<g class="pill"><rect x="82" y="87" width="220" height="72" rx="18" fill="#17172D" stroke="#8B5CF6"/><text x="192" y="117" fill="#C4B5FD" font-size="13" font-weight="700">LANGUAGES</text><text x="192" y="142" fill="#F8FAFC" font-size="15">Java / C# / TypeScript / SQL</text></g>
<g class="pill d2"><rect x="898" y="87" width="220" height="72" rx="18" fill="#10202C" stroke="#06B6D4"/><text x="1008" y="117" fill="#67E8F9" font-size="13" font-weight="700">DATA</text><text x="1008" y="142" fill="#F8FAFC" font-size="15">PostgreSQL / Oracle / Redis</text></g>
<g class="pill d3"><rect x="44" y="330" width="240" height="72" rx="18" fill="#10251E" stroke="#22C55E"/><text x="164" y="360" fill="#86EFAC" font-size="13" font-weight="700">CLOUD &amp; DELIVERY</text><text x="164" y="385" fill="#F8FAFC" font-size="15">AWS / Docker / Kubernetes</text></g>
<g class="pill d4"><rect x="916" y="330" width="240" height="72" rx="18" fill="#17172D" stroke="#8B5CF6"/><text x="1036" y="360" fill="#C4B5FD" font-size="13" font-weight="700">MESSAGING</text><text x="1036" y="385" fill="#F8FAFC" font-size="15">Kafka / RabbitMQ / gRPC</text></g>
<g class="pill d5"><rect x="370" y="409" width="210" height="60" rx="16" fill="#10202C" stroke="#06B6D4"/><text x="475" y="435" fill="#67E8F9" font-size="13" font-weight="700">QUALITY</text><text x="475" y="456" fill="#F8FAFC" font-size="14">JUnit / Mockito / SonarQube</text></g>
<g class="pill d6"><rect x="620" y="409" width="210" height="60" rx="16" fill="#10251E" stroke="#22C55E"/><text x="725" y="435" fill="#86EFAC" font-size="13" font-weight="700">PLATFORM</text><text x="725" y="456" fill="#F8FAFC" font-size="14">Jenkins / Actions / Terraform</text></g>
</g></svg>
